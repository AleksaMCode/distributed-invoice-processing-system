name: Java Format Check

on:
  pull_request:
    branches: [master]
    paths:
      - "watcher_service/**"
  push:
    branches: [master]
    paths:
      - "watcher_service/**"

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Spotless format check
        working-directory: watcher_service
        run: ./gradlew spotlessCheck
