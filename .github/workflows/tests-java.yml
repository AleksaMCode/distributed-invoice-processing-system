name: Java Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "watcher_service/**"
  push:
    branches: [master]
    paths:
      - "watcher_service/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x watcher_service/gradlew

      - name: Run watcher tests
        working-directory: watcher_service
        run: ./gradlew test
